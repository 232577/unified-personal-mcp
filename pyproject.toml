[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-personal-mcp"
version = "0.1.7"
description = "One configurable Windows host for coding, desktop and browser tools over an OpenAI Secure MCP Tunnel."
requires-python = ">=3.13,<3.14"
dependencies = [
  "PyJWT==2.14.0", "Windows-MCP==0.8.5", "FastMCP==4.0.3", "mcp==2.2.0",
  "psutil==7.2.2", "PyYAML==6.0.3", "jsonschema==4.26.0", "playwright==1.63.0",
  "windows-capture==2.0.1", "opencv-python==5.0.0.93", "pywin32==312",
]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Unified Personal MCP Contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/232577/unified-personal-mcp"
Source = "https://github.com/232577/unified-personal-mcp"
Issues = "https://github.com/232577/unified-personal-mcp/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.22", "mypy>=2.1,<2.2", "typing_extensions>=4.12"]
fixture = ["pywebview==6.0", "pythonnet==3.1.0", "pyinstaller==6.22.0"]
desktop = ["PySide6>=6.8,<6.9"]
image = ["Pillow>=10.0"]

[project.scripts]
unified-personal-mcp = "personal_mcp.__main__:main"
coding-tools-mcp = "coding_tools_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["personal_mcp*", "bf_automation*", "coding_tools_mcp*"]
