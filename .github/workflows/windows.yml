name: Windows unit checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-windows.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.1.1 ruff==0.15.22
      - name: Prepare local fixture directories
        run: New-Item -ItemType Directory -Force resources/browsers,verification | Out-Null
      - name: Prepare pinned search and browser resources
        run: python scripts/prepare_assets.py
      - name: Unit and HTTP checks
        run: |
          $env:PATH = (Join-Path $pwd 'resources/bin') + ';' + $env:PATH
          python -m pytest -q tests_personal tests_bf tests/test_runtime_boundary_regressions.py --basetemp=verification/ci --junitxml=verification/results.xml
      - name: Lint unified sources
        run: python -m ruff check personal_mcp bf_automation tests_personal tests_bf coding_tools_mcp/protocol.py coding_tools_mcp/server.py tests/test_runtime_boundary_regressions.py scripts/build_update.py scripts/prepare_update.py scripts/switch_managed_release.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-test-results
          path: verification/results.xml

